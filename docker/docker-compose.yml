services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: collision-perception:humble
    container_name: cp_dev
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - ..:/ws:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority:rw
    working_dir: /ws
    stdin_open: true
    tty: true

# Loop round the shelves of the default warehouse, relative to the start pose: x
# forward, y left of the robot, which starts at (-8, 0) facing +x. Pedestrians and the
# forklift cross this loop, so expect the collision monitor to hold the robot now and then.
#   ros2 run waypoint_navigation nav_goal route warehouse_route.yaml
relative: true
speed: 0.5
waypoints:
  - [0.0, 4.2]
  - [16.0, 4.2]
  - [16.0, -4.2]
  - [0.0, -4.2]
  - [0.0, 0.0]
heading_deg: 0.0

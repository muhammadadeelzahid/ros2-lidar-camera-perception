# Loop round the shelves of the default warehouse, in the odom frame. The robot starts
# at world (-8, 0) facing +x, which is the odom origin. Pedestrians and the forklift
# cross this loop, so expect the collision monitor to hold the robot now and then.
#   ros2 run waypoint_navigation nav_goal route warehouse_route.yaml
relative: false
speed: 0.5
waypoints:
  - [0.0, 4.2]
  - [16.0, 4.2]
  - [16.0, -4.2]
  - [0.0, -4.2]
  - [0.0, 0.0]
heading_deg: 0.0

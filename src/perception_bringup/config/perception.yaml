/lidar_detector:
  ros__parameters:
    # Leave empty to use the frame_id from the point cloud.
    lidar_frame: ''

/camera_detector:
  ros__parameters:
    weights: yolov8n.pt
    conf: 0.4

/fusion_tracker:
  ros__parameters:
    # Frame the tracks are kept in. Use odom when the base publishes odometry,
    # or the base frame for a sensor rig without odometry.
    tracking_frame: odom
    gate_distance: 2.0
    max_age: 1.0
    min_hits: 3

/collision_monitor:
  ros__parameters:
    # Set false when there is no odometry; tracks are then treated as
    # relative to the vehicle (tracking_frame must be the base frame).
    use_odom: true
    ego_length: 0.4
    ego_width: 0.3
    enable_estop: true
    crit_dist: 0.5
    warn_dist: 1.5
    info_dist: 3.0
    crit_ttc: 1.0
    warn_ttc: 3.0
    tracks_timeout: 0.5          # s without /tracks before the robot is held stopped
    # Tip-over stability from /imu. Contacts and CG are in the base frame; the
    # defaults are the sim robot: two wheels and two centre-line casters.
    use_stability: true
    stability_gate: true         # false: warn only, never change commands
    support_points: [0.17, 0.0, 0.0, 0.17, -0.17, 0.0, 0.0, -0.17]   # x, y pairs (m)
    cg: [0.0, 0.0, 0.12]         # m; raise z for a load carried high
    stability_info_deg: 15.0
    stability_warn_deg: 10.0
    stability_crit_deg: 5.0
    stability_min_margin_deg: 5.0   # commands are scaled down to keep this margin
    imu_timeout: 0.2             # s without /imu before the robot is held stopped
    attitude_time_constant: 1.0  # s, gyro vs accelerometer crossover
    accel_lowpass_hz: 2.0        # tipping develops over about a second; keeps vibration out
    response_time: 0.5           # s to reach a commanded speed
    max_accel: 1.0               # m/s^2 the drive can deliver
    max_decel: 0.5               # m/s^2 used when the stability limit slows the robot
    # Protective field on the raw point cloud, independent of detection.
    use_protective_field: true
    base_frame: base_footprint   # base_link on most real robots
    field_min_length: 0.4        # m ahead of the bumper, plus speed * reaction time
    field_reaction_time: 1.0
    field_margin: 0.1            # m added on each side of the vehicle width
    field_min_z: 0.1             # m above the base frame; ignores the ground
    field_max_z: 2.0
    field_min_points: 3
